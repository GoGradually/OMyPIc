name: Release

# Builds the desktop installers on the OS each one targets and attaches them to a draft
# GitHub Release. The draft is published by hand.
#   - Push a version tag (for example v0.2.0), or
#   - run it manually with a version: the tag is then created when the draft is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft a release for, for example 0.2.0. Leave empty to only build the installers.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The workspace contains the Tauri crate, so compiling it needs the WebKitGTK development packages.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libsecret-1-dev libssl-dev pkg-config build-essential xdg-utils
      # Installs the toolchain and components pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Backend tests
        run: cargo test --workspace
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:desktop:win
            artifact: installer-windows-x64
            files: target/release/bundle/nsis/*.exe
          - os: macos-latest
            script: build:desktop:mac
            artifact: installer-macos-arm64
            files: target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Installs the toolchain pinned by rust-toolchain.toml.
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # tauri build runs the web build and the embedding bundle step first (beforeBuildCommand).
      # Installers are unsigned for now (README, code signing policy).
      - name: Build installer
        working-directory: frontend
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            flags="--verify-tag"
          else
            # Manual run: the tag does not exist yet. Publishing the draft creates it on this commit.
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "version must look like 0.2.0 or 0.2.0-rc.1" >&2
              exit 1
            fi
            tag="v$VERSION"
            flags="--target $COMMIT"
          fi
          case "$tag" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$tag" --draft --generate-notes $flags --title "OMyPIc $tag" installers/*
