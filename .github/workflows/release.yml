name: Release

# Builds the desktop installers on the OS each one targets and attaches them to a draft
# GitHub Release. Push a version tag (for example v0.2.0) to run it; the draft is published by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Backend tests
        working-directory: backend
        run: ./gradlew --no-daemon test
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: electron:build:win
            artifact: installer-windows-x64
            files: frontend/dist/*.exe
          - os: macos-latest
            script: electron:build:mac
            artifact: installer-macos-arm64
            files: frontend/dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      # electron:prep builds the backend JAR and downloads the MongoDB and JRE binaries for this OS.
      - name: Build installer
        working-directory: frontend
        shell: bash
        env:
          # Installers are unsigned for now (README, code signing policy).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--draft --verify-tag --generate-notes"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags --title "OMyPIc $TAG" installers/*
