[workspace]
members = ["backend/crates/*"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
flate2 = "1"
sha2 = "0.10"
regex = "1"
httpmock = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tower = { version = "0.5", features = ["util"] }
futures-core = "0.3"
http-body-util = "0.1"
anyhow = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }
